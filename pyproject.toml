[project]
name = "minutas"
version = "0.0.0"
description = "Records work meetings on GNOME, transcribes them and publishes them to Agaric, GitLab and GitHub."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "jiwer>=4.0.0",
    "keyring>=25.7.0",
]

[project.optional-dependencies]
# The speech environment install.sh builds, where minutas.transcriber runs. An extra, not a
# dependency group: deptry reads a group as development tools the package may not import.
speech = [
    "nemo-toolkit[asr]>=3.0.0",
    "omegaconf>=2.3.0",
    "pyannote-audio>=4",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
]

[project.scripts]
minutas = "minutas.cli:main"

[project.urls]
Repository = "https://github.com/jfolcini/minutas"
Issues = "https://github.com/jfolcini/minutas/issues"

[dependency-groups]
# Every lint, format, test and hook tool, pinned by uv.lock. prek runs them
# with `uv run`, so `uv sync` is the whole toolchain install.
dev = [
    "actionlint-py>=1.7.12.25",
    "beartype>=0.23.1",
    "conventional-pre-commit>=4.5.0",
    "deptry>=0.25.1",
    "diff-cover>=11.0.3",
    "hypothesis>=6.170.15",
    "import-linter>=2.17",
    "mutmut>=3.8.1",
    "pip-audit>=2.10.1",
    "prek>=0.5.11",
    "pygobject-stubs>=2.20.0",
    "pytest>=9.2.0",
    "pytest-beartype>=0.3.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.5",
    "rumdl>=0.3.4",
    "rust-just>=1.59.0",
    "shellcheck-py>=0.11.0.1",
    "shfmt-py>=4.2.0",
    "ty>=0.0.105",
    "typos>=1.52.2",
    "zizmor>=1.32.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.32"
# pyannote brings these in; naming them here is what makes [tool.uv.sources] take their CPU
# builds from the PyTorch index along with torch.
constraint-dependencies = ["torchaudio>=2.11.1", "torchcodec>=0.17.0"]
# pygobject-stubs depends on PyGObject, which builds only against GTK's development headers; the
# window runs on Ubuntu's own (python3-gi), and so do its tests (tests/conftest.py).
exclude-dependencies = ["pygobject"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Every rule on; the ignores below are the deliberate exceptions.
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY",    # no per-file copyright headers; LICENSE covers the tree
    "D",      # names do the explaining; docstrings where they say why
    "ISC001", # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"src/minutas/transcriber.py" = [
    "PLC0415", # the speech stack is imported where it is used: the app and the tests lack it
]
"tests/**" = [
    "INP001",  # tests are not a package (pytest --import-mode=importlib)
    "PLR2004", # literal expected values are the point of a test
    "S101",    # pytest asserts
]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
# The speech stack lives in install.sh's environment, not in the development one.
allowed-unresolved-imports = [
    "nemo.**",
    "omegaconf",
    "pyannote.**",
    "silero_vad",
    "soundfile",
    "torch.**",
]

[tool.ty.rules]
# Every rule, the ones off by default included, is an error. ty checks types;
# ruff's ANN rules require the annotations it checks.
all = "error"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing:skip-covered",
]
xfail_strict = true
filterwarnings = ["error"]
# A hung child process (pw-record, glab, devin) fails its test instead of the CI job.
timeout = 60
# Every annotation in the package is checked at run time while the tests run.
beartype_packages = "minutas"

[tool.mutmut]
source_paths = ["src/minutas/"]
# mutmut's trampolines skew coverage and runtime type checks; the gates run elsewhere.
pytest_add_cli_args = ["--no-cov", "-o", "beartype_packages="]
# Each mutant's tests in a process that imported nothing before its fork: GLib's threads, which
# the window's tests wait on, do not survive a fork from one that loaded GTK, so every one fails.
process_isolation = "forkserver"
forkserver_warmup = "none"

[tool.deptry]
known_first_party = ["minutas"]

# The speech extra is not installed where deptry runs, so it cannot look these up.
[tool.deptry.package_module_name_map]
nemo-toolkit = "nemo"
omegaconf = "omegaconf"
pyannote-audio = "pyannote"
silero-vad = "silero_vad"
soundfile = "soundfile"
torch = "torch"

[tool.deptry.per_rule_ignores]
# PyGObject is Ubuntu's own (python3-gi, an install.sh system package): the window runs on the
# system Python, and PyPI's builds only against GTK's development headers.
DEP001 = ["gi"]

[tool.coverage.run]
branch = true
source = ["minutas"]
# Measures `python -m minutas` and other child Pythons the tests start.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.importlinter]
root_package = "minutas"

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
    "minutas.cli",
    # The window draws what window_view works out, and reaches the rest of the program only
    # through the worker, the store, the settings, the summarizer's presets, context presets and
    # models and the GitLab and GitHub publishers' reading of a link and of glab's or gh's
    # version; it runs the publishers and the summarizer as commands.
    "minutas.window",
    # GitLab's mixes the tracks; both name a new issue as Publish to Agaric does for a page.
    "(minutas.gitlab) | (minutas.github)",
    # The recorder unit's program: the recorder names its signals and never imports it.
    "minutas.capture",
    "(minutas.recorder) | (minutas.worker) | (minutas.agaric) | (minutas.summarizer) | (minutas.window_view) | (minutas.calendar)",
    "minutas.store",
    "minutas.settings",
    "minutas.atomic",
]

[[tool.importlinter.contracts]]
name = "the transcriber runs in the speech environment and shares no code with the app"
type = "forbidden"
source_modules = ["minutas.transcriber"]
forbidden_modules = ["minutas.*"]
