version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A new release waits a week before it is proposed: most compromised
    # releases are caught and yanked inside that window.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels: [dependencies, python]
    groups:
      # The lint, test and hook toolchain moves as one PR.
      dev-tools:
        dependency-type: development
