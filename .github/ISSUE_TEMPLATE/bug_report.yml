name: Bug report
description: Something is broken in Minutas. File it here.
title: 'bug: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.

        Security issue? **Do not file here.** See [SECURITY.md](https://github.com/jfolcini/minutas/blob/main/SECURITY.md) for the private channel.

  - type: checkboxes
    id: prereqs
    attributes:
      label: Before you file
      options:
        - label: I searched [open and closed issues](https://github.com/jfolcini/minutas/issues?q=is%3Aissue) and could not find a duplicate.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence describing what is wrong.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Press Record in the top bar.
        2. Stop after a minute.
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Exact error text, and the failed run's Details from the history window if there is one.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Minutas version
      description: '`minutas --version`, or the commit SHA.'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and GNOME version
      placeholder: 'Ubuntu 24.04.1 LTS, GNOME 46'
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Workarounds, related issues, suspected cause. Please leave meeting content out.
