name: Validate

# Reusable: the checks `prek run --all-files` runs locally, plus the test suite.
#   - lint         — every prek hook in both stages (tests run in `test`), zizmor's
#                    online audits, and lychee over the Markdown links.
#   - test         — pytest with branch coverage and the floor in pyproject.toml, on
#                    the floor Python and the newest one, plus a leg on the lowest
#                    versions pyproject.toml allows; on a PR, every changed line covered.
#                    The history window's tests run it for real, on Ubuntu's GTK.
#   - extension    — the GNOME Shell extension: oxfmt, oxlint, the TypeScript check,
#                    the vitest unit tests and a headless GNOME Shell 46 smoke test,
#                    each the command its `just ext` recipe runs.
#   - validate-all — one stable check name for branch protection; fails unless
#                    every job above succeeded.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: 'true'
  FORCE_COLOR: '1'

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # actionlint-py builds from source, fetching actionlint from GitHub's releases, and gives
      # up on the 403 GitHub now and then answers there: one more try after a pause.
      - name: Install the toolchain
        run: uv sync || { sleep 30; uv sync; }

      # The extension's hooks need its node_modules; the extension job runs them.
      - name: prek, pre-commit stage
        env:
          SKIP: oxfmt,oxlint,vitest
        run: uv run prek run --all-files --show-diff-on-failure

      # no-commit-to-branch guards a local push; pytest is the `test` job.
      - name: prek, pre-push stage
        env:
          SKIP: no-commit-to-branch,pytest
        run: uv run prek run --all-files --hook-stage pre-push

      # The audits that ask GitHub (known-vulnerable actions, pins that are not
      # real commits); the prek hook runs offline.
      - name: zizmor (online audits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run zizmor --min-severity=low .github/

      - name: Markdown links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress './**/*.md'
          fail: true

  test:
    name: test (${{ matrix.python }}${{ matrix.resolution && format(', {0}', matrix.resolution) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        include:
          # The floor (Ubuntu 24.04's system Python), with the lock.
          - python: '3.12'
            coverage-diff: true
          # The newest Python, to see deprecations before Ubuntu ships it. Ubuntu builds
          # its PyGObject for its own Python alone, so the window's tests are skipped
          # here, and the coverage floor, which counts the window, goes with them.
          - python: '3.14'
            pytest-args: --cov-fail-under=0
          # The lowest versions pyproject.toml allows, so its floors stay true.
          - python: '3.12'
            resolution: lowest-direct
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # diff-cover compares against origin/main.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Re-lock at the lowest allowed versions
        if: matrix.resolution
        env:
          UV_FROZEN: 'false'
          RESOLUTION: ${{ matrix.resolution }}
        run: uv lock --resolution "$RESOLUTION"

      # One more try after a pause, as the lint job's install.
      - name: Install
        run: uv sync || { sleep 30; uv sync; }

      # The window's tests run it on Ubuntu's own PyGObject, GTK and libadwaita, on an Xvfb
      # display and a session bus of their own (tests/conftest.py); the calendar's tests read
      # libical events through Evolution Data Server's typelibs; the recorder's run its pipeline
      # on GStreamer, with a test source.
      - name: Install GTK, libadwaita, Evolution Data Server's typelibs, GStreamer, PyGObject and Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            -o Acquire::http::Timeout=30 -o Acquire::Retries=3 \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-ecal-2.0 gir1.2-edataserver-1.2 \
            gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base xvfb dbus-daemon

      - name: pytest (coverage gate)
        env:
          PYTEST_ARGS: ${{ matrix.pytest-args }}
        run: uv run pytest --cov-report=xml ${PYTEST_ARGS:+"$PYTEST_ARGS"}

      # Every line a PR adds or changes is covered, whatever the project total.
      - name: Changed lines covered (diff-cover)
        if: matrix.coverage-diff && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=100

      - name: Upload the coverage report
        if: always() && matrix.coverage-diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  extension:
    runs-on: ubuntu-24.04
    # Room for a cold package cache on a slow mirror; a warm run takes about a minute.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The runners' Ubuntu mirror has taken longer than this job's old limit to serve GNOME
      # Shell's packages, so the downloaded .debs are kept in the Actions cache, keyed on the
      # runner image, and saved right after the install so a later failing step can't lose them.
      - name: Restore the GNOME Shell packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: extension-apt-${{ env.ImageOS }}-${{ env.ImageVersion }}-gnome-shell-gjs-dbus-daemon

      # Ubuntu 24.04 ships GNOME Shell 46 and gjs 1.80, the oldest the extension supports.
      # The timeout and retries make apt fetch a stalled file again instead of hanging.
      - name: Install GNOME Shell and gjs
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true \
            -o Acquire::http::Timeout=30 -o Acquire::Retries=3 \
            gnome-shell gjs dbus-daemon
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - name: Save the GNOME Shell packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Install the Node tools
        run: npm ci

      - name: oxfmt
        run: npx oxfmt --check .

      - name: oxlint
        run: npx oxlint --deny-warnings

      - name: Type-check (TypeScript checkJs)
        run: npx tsc -p .

      - name: Unit tests (vitest)
        run: npx vitest run

      # Keeps the Shell's log and the menu screenshots for the upload below.
      - name: Smoke test (headless GNOME Shell)
        run: bash tests/smoke.sh "$RUNNER_TEMP/smoke"

      - name: Upload the smoke test's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke
          path: |
            ${{ runner.temp }}/smoke/*.log
            ${{ runner.temp }}/smoke/*.png
          retention-days: 14
          if-no-files-found: ignore

  validate-all:
    needs: [lint, test, extension]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A validate job ended '$result': $RESULTS"
              exit 1
            fi
          done
