name: Validate

# Reusable: the checks `prek run --all-files` runs locally, plus the test suite.
#   - lint         — every prek hook in both stages (tests run in `test`), and
#                    lychee over the Markdown links.
#   - test         — pytest with branch coverage and the floor in pyproject.toml.
#   - validate-all — one stable check name for branch protection; fails unless
#                    every job above succeeded.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: 'true'
  FORCE_COLOR: '1'

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install the toolchain
        run: uv sync

      - name: prek, pre-commit stage
        run: uv run prek run --all-files --show-diff-on-failure

      # no-commit-to-branch guards a local push; pytest is the `test` job.
      - name: prek, pre-push stage
        env:
          SKIP: no-commit-to-branch,pytest
        run: uv run prek run --all-files --hook-stage pre-push

      - name: Markdown links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress './**/*.md'
          fail: true

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install
        run: uv sync

      - name: pytest (coverage gate)
        run: uv run pytest --cov-report=xml

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  validate-all:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A validate job ended '$result': $RESULTS"
              exit 1
            fi
          done
