name: Mutation testing

# Weekly and on demand, report only: a surviving mutant is a change to the code
# that no test notices. Gates nothing (it is not in validate-all).
on:
  schedule:
    - cron: '0 5 * * 3'
  workflow_dispatch:
    inputs:
      pattern:
        description: Mutant names to run (a glob such as `minutas.store*`); empty runs all.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: 'true'

jobs:
  mutmut:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # One more try after a pause, as _validate.yml's lint job's install.
      - name: Install
        run: uv sync || { sleep 30; uv sync; }

      # The suite runs the history window on Ubuntu's own PyGObject, GTK and libadwaita, on an Xvfb
      # display and a session bus of their own (tests/conftest.py); the calendar's tests read
      # libical events through Evolution Data Server's typelibs; the recorder's run its pipeline
      # on GStreamer, with a test source, its silence on the good plugins' level and the
      # player's on their scaletempo.
      - name: Install GTK, libadwaita, Evolution Data Server's typelibs, GStreamer, PyGObject and Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            -o Acquire::http::Timeout=30 -o Acquire::Retries=3 \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-ecal-2.0 gir1.2-edataserver-1.2 \
            gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            xvfb dbus-daemon

      - name: mutmut
        env:
          PATTERN: ${{ inputs.pattern }}
        run: |
          # shellcheck disable=SC2086 # unquoted: an empty pattern means "all mutants"
          uv run mutmut run $PATTERN

      - name: Surviving mutants
        if: always()
        run: |
          {
            echo '## Surviving mutants'
            echo
            echo '```'
            uv run mutmut results
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
