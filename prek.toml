# Git hooks, run by prek (https://prek.j178.dev). CI runs the same list
# (`.github/workflows/_validate.yml`), so a green `prek run --all-files` locally
# is a green lint job.
#
# Every tool a local hook calls is a dev dependency in pyproject.toml, pinned by
# uv.lock and run with `uv run --frozen`: `uv sync` installs the whole toolchain
# and Dependabot bumps it. Remote repos are pinned by commit SHA.
#
# Every hook carries a `# WHY:` line: the defect it stops. A hook that stops
# nothing real gets deleted (AGENTS.md § Pre-commit and CI).

# A plain `prek install` writes only the pre-commit shim; these stages need theirs.
default_install_hook_types = ["pre-commit", "commit-msg", "prepare-commit-msg", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    # WHY: trailing whitespace churns every diff it touches
    { id = "trailing-whitespace", stages = ["pre-commit"] },
    # WHY: a missing final newline churns diffs and breaks line-oriented tools
    { id = "end-of-file-fixer", stages = ["pre-commit"] },
    # WHY: malformed YAML surfaces only as a runtime failure in CI
    { id = "check-yaml", stages = ["pre-commit"] },
    # WHY: malformed TOML breaks the build after the commit, not during it
    { id = "check-toml", stages = ["pre-commit"] },
    # WHY: malformed JSON config breaks tooling late
    { id = "check-json", stages = ["pre-commit"] },
    # WHY: conflict markers committed as source
    { id = "check-merge-conflict", stages = ["pre-commit"] },
    # WHY: an accidental large binary (a recording, a model) is permanent in git history
    { id = "check-added-large-files", args = ["--maxkb=500"], stages = ["pre-commit"] },
    # WHY: a direct push to the default branch bypasses PR review and CI
    { id = "no-commit-to-branch", args = ["--branch=main"], stages = ["pre-push"] },
    # WHY: a committed private key is an unrevocable secret leak
    { id = "detect-private-key", stages = ["pre-commit"] },
    # WHY: a script added without chmod +x fails only when something runs it
    { id = "check-shebang-scripts-are-executable", stages = ["pre-commit"] },
    # WHY: an +x file with no shebang runs under whatever interpreter the caller guesses
    { id = "check-executables-have-shebangs", stages = ["pre-commit"] },
    # WHY: CRLF leakage from other platforms churns diffs
    { id = "mixed-line-ending", args = ["--fix=lf"], stages = ["pre-commit"] },
]

# WHY: committed credentials (Agaric agent tokens, Hugging Face tokens) are an unrevocable leak
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e" # v8.30.1
hooks = [{ id = "gitleaks", stages = ["pre-commit"] }]

[[repos]]
repo = "local"

# WHY: non-conventional subjects break changelog and scope tooling
[[repos.hooks]]
id = "conventional-pre-commit"
name = "conventional commit subject"
entry = "uv run --frozen conventional-pre-commit"
language = "system"
stages = ["commit-msg"]

# WHY: a forgotten `git commit -s` fails the DCO check after the push (.github/workflows/dco.yml)
[[repos.hooks]]
id = "dco-signoff"
name = "DCO sign-off (auto-append)"
entry = "bash scripts/dco-signoff.sh"
language = "system"
stages = ["prepare-commit-msg"]
always_run = true

# WHY: uv.lock out of step with pyproject.toml installs something other than what was reviewed
[[repos.hooks]]
id = "uv-lock"
name = "uv.lock matches pyproject.toml"
entry = "uv lock --check"
language = "system"
files = '^(pyproject\.toml|uv\.lock)$'
pass_filenames = false
stages = ["pre-commit"]

# Auto-fixers: a fix rewrites the file, prek fails the run, re-stage and commit again.
# WHY: lint regressions reaching CI; fixable ones are fixed in place
[[repos.hooks]]
id = "ruff-check"
name = "ruff check (fix)"
entry = "uv run --frozen ruff check --fix --exit-non-zero-on-fix"
language = "system"
types_or = ["python", "pyi"]
stages = ["pre-commit"]

# WHY: formatting misses reaching CI; the formatter is the style
[[repos.hooks]]
id = "ruff-format"
name = "ruff format (write)"
entry = "uv run --frozen ruff format"
language = "system"
types_or = ["python", "pyi"]
stages = ["pre-commit"]

# Whole program: a type error's answer for one file depends on the others.
# WHY: type errors reaching CI
[[repos.hooks]]
id = "ty"
name = "ty (every rule an error)"
entry = "uv run --frozen ty check"
language = "system"
types_or = ["python", "pyi", "toml"]
pass_filenames = false
stages = ["pre-commit"]

# WHY: a module reaching across the boundaries docs/design.md keeps (summarizer, publisher, recorder, calendar, top bar)
[[repos.hooks]]
id = "import-linter"
name = "import contracts (import-linter)"
entry = "uv run --frozen lint-imports"
language = "system"
types_or = ["python", "toml"]
pass_filenames = false
stages = ["pre-commit"]

# WHY: an import missing from pyproject.toml works locally and breaks a fresh install; a declared dependency nothing imports
[[repos.hooks]]
id = "deptry"
name = "dependencies match imports (deptry)"
entry = "uv run --frozen deptry src"
language = "system"
types_or = ["python", "toml"]
pass_filenames = false
stages = ["pre-commit"]

# WHY: typos in code and docs reaching review
[[repos.hooks]]
id = "typos"
name = "typos"
entry = "uv run --frozen typos --force-exclude"
language = "system"
types = ["text"]
stages = ["pre-commit"]

# WHY: broken Markdown and relative links to files that do not exist
[[repos.hooks]]
id = "rumdl"
name = "markdown lint (rumdl)"
entry = "uv run --frozen rumdl check"
language = "system"
types = ["markdown"]
stages = ["pre-commit"]

# WHY: shell bugs (unquoted expansions, missing set -e paths) surface only at run time
[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
entry = "uv run --frozen shellcheck --severity=warning"
language = "system"
types = ["shell"]
stages = ["pre-commit"]

# WHY: shell formatting drift; the formatter is the style (.editorconfig)
[[repos.hooks]]
id = "shfmt"
name = "shfmt (write)"
entry = "uv run --frozen shfmt --write"
language = "system"
types = ["shell"]
stages = ["pre-commit"]

# The tool is the extension's npm dev dependency (`just ext setup`), pinned by
# extension/package-lock.json; ESLint finds extension/eslint.config.js from each file.
# WHY: an undefined name or unused variable in the extension surfaces only when GNOME Shell loads it
[[repos.hooks]]
id = "eslint"
name = "eslint (extension)"
entry = "extension/node_modules/.bin/eslint"
language = "system"
files = '^extension/.*\.js$'
stages = ["pre-commit"]

# WHY: workflow syntax and expression errors surface only on the next CI run
[[repos.hooks]]
id = "actionlint"
name = "actionlint"
entry = "uv run --frozen actionlint"
language = "system"
files = '^\.github/workflows/.*\.ya?ml$'
stages = ["pre-commit"]

# WHY: workflow security defects (template injection, excessive permissions, unpinned actions)
[[repos.hooks]]
id = "zizmor"
name = "zizmor"
entry = "uv run --frozen zizmor --offline --min-severity=low"
language = "system"
files = '^\.github/(workflows/.*\.ya?ml|dependabot\.yml)$'
stages = ["pre-commit"]

# `--color never`: under FORCE_COLOR (CI) uv colours the export's comment lines,
# which pip-audit then fails to parse. `sed`: PyPI has no `+cpu` builds, so pip-audit
# would skip torch, torchaudio and torchcodec; their public versions share the advisories.
# WHY: a known-vulnerable dependency shipping unnoticed between Dependabot runs
[[repos.hooks]]
id = "pip-audit"
name = "pip-audit (uv.lock)"
entry = "bash -c 'uv export --color never --frozen --no-emit-project --all-groups --format requirements-txt | sed s/+cpu// | uv run --frozen pip-audit --disable-pip --require-hashes --requirement /dev/stdin \"$@\"' --"
# Advisories no upgrade can fix yet; drop each when its holder lifts the bound.
args = [
    # WHY: nemo-toolkit caps lightning at 2.4.0, which caps fsspec below 2026.0
    "--ignore-vuln=PYSEC-2026-4217",
    # WHY: nemo-toolkit caps hydra-core at 1.3.2
    "--ignore-vuln=PYSEC-2026-3850",
    "--ignore-vuln=PYSEC-2026-4221",
    # WHY: nemo-toolkit caps lightning at 2.4.0
    "--ignore-vuln=PYSEC-2026-3624",
    "--ignore-vuln=PYSEC-2026-3972",
]
language = "system"
files = '^(pyproject\.toml|uv\.lock)$'
pass_filenames = false
stages = ["pre-push"]

# The suite with its coverage floor (pyproject.toml), the CI test job's check.
# WHY: a red test or a coverage drop found by CI after the push instead of before it
[[repos.hooks]]
id = "pytest"
name = "pytest (coverage gate)"
entry = "uv run --frozen pytest -q"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]
